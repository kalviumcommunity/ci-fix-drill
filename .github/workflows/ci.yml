name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        # FIXED: Use npm ci for reliable, reproducible dependency resolution in CI environments
        run: npm ci

  test:
    runs-on: ubuntu-latest
    # FIXED: Added needs block so the test job waits for install to finish successfully
    needs: install
    steps:
      # FIXED: Added checkout, setup-node, and install steps so tests have code and dependencies
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
