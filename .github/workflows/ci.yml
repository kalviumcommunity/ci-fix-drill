name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

  test:
    runs-on: ubuntu-latest

    # Wait for the install job to complete successfully before running tests.
    # This fixes the workflow sequencing issue found in the CI pipeline.
    needs: install

    steps:
      # Each GitHub Actions job runs on a fresh virtual machine,
      # so we must check out the repository again.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Install dependencies again because jobs do not share node_modules.
      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test