name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        # Fixed BUG 1: npm ci instead of npm install — ci fails loudly on a
        # lockfile/package.json mismatch instead of silently rewriting the lock,
        # so installs stay reproducible. Requires package-lock.json to be in sync
        # (regenerated it — see Task 3 in DIAGNOSIS.md).
        run: npm ci

  test:
    runs-on: ubuntu-latest
    # Fixed BUG 2: added needs: install so this job only starts once install
    # succeeds (jobs run on isolated runners regardless, but this still gives
    # correct ordering/fail-fast — each job installs its own deps below).
    needs: install
    steps:
      # Fixed BUG 3: this job had no checkout step, so the runner's workspace
      # was empty and npm test couldn't even find package.json. Added checkout
      # + setup-node + npm ci so this job is self-contained like install is.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
