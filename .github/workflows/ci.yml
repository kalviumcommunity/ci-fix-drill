name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      # FIXED: Changed from 'npm install' to 'npm ci' for reproducible, deterministic installs
      # npm ci deletes node_modules and installs exact versions from package-lock.json
      - name: Install dependencies
        run: npm ci

  test:
    runs-on: ubuntu-latest
    # FIXED: Added needs: [install] to ensure test runs after install completes
    # However, each job runs on a fresh VM, so we still need checkout and install steps below
    needs: [install]
    steps:
      # FIXED: Added checkout step - required to access repository code
      - uses: actions/checkout@v4
      # FIXED: Added Node.js setup - required to run npm and node commands
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      # FIXED: Added npm ci step - each job runs in isolation, needs its own dependencies
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
